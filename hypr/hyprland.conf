$scriptPath = $HOME/.config/hypr/script



# source = ~/.config/hypr/nvidia.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/themes/theme.conf



# See https://wiki.hyprland.org/Configuring/Keywords/
# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 & # authentication dialogue for GUI apps
# exec-once = $scriptPath/resetxdgportal.sh # reset XDPH for screenshare
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = dbus-update-activation-environment --systemd --all # for XDPH
exec-once = systemctl --user start hyprpolkitagent
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = blueman-applet # systray app for Bluetooth
exec-once = udiskie --no-automount --smart-tray # front-end that allows to manage removable media
exec-once = nm-applet --indicator # systray app for Network/Wifi
exec-once = wl-paste --type text --watch cliphist store # clipboard store text data
exec-once = wl-paste --type image --watch cliphist store # clipboard store image data
exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = fcitx5 -d
# exec-once = hyprshade on ~/.config/hypr/shader/gridlines.frag
exec-once = $scriptPath/bg-battery-check.sh

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
# env = QT_QPA_PLATFORM,xcb
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_SCALE,1
env = XCURSOR_SIZE,25
env = HYPRCURSOR_SIZE,25
env = HYPRCURSOR_THEME,Nordzy-hyprcursors
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = _JAVA_AWT_WM_NONREPARENTING,1

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = ,preferred,auto,1

general {
    gaps_in = 5
    gaps_out = 8
    border_size = 2
    layout = dwindle
    resize_on_border = true

    col.active_border = $active
    col.inactive_border = $inactive
}

decoration {
    rounding = 0

    blur {
        enabled = yes
        size = 5
        passes = 2
        noise= 0.05
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }

    shadow {
        enabled = yes
        color = $active-shadow
        color_inactive = $inactive
        range = 1
        sharp = true
        ignore_window = false
        offset = 3 2
        render_power = 1
    }
}

# See https://wiki.hyprland.org/Configuring/Animations/
animations {
    bezier = in-out,.65,-0.01,0,.95
    bezier = woa,0,0,0,1
    animation=windows,1,2,woa,popin
    animation=border,1,10,default
    animation=fade,1,10,default
    animation=workspaces,1,2,in-out,slide
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
    pseudotile = yes
    preserve_split = yes
    force_split = 2
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/
master {
    new_status = master
}

xwayland {
    force_zero_scaling = true
}

ecosystem {
    no_update_news = true
}

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0
    force_no_accel = 1
}

device {
    name = mouse 1
    sensitivity = -0.5
}

misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
